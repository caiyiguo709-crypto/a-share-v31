name: Safety tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m ashare.cli build --mode demo --output /tmp/demo.json
      - run: python -m ashare.cli backtest --demo --allow-synthetic --sensitivity
      - run: node --check site/app.js
