name: Collect daily public analysis (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m ashare.cli build --mode live --timeout 18
      - uses: actions/upload-artifact@v4
        with:
          name: public-analysis
          path: |
            site/
            docs/interface-report.json
          retention-days: 3
