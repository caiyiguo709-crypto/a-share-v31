name: V3.1 Beta 0.3B manual diagnostic (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta03-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Initialize failure evidence
        run: python -m poc.cloud_report_beta03 finalize
        # No probes/tests yet; initialize NOT_RUN evidence without treating it as acceptance.
        continue-on-error: true
      - name: Install audited dependencies
        run: python -m pip install -r requirements.lock
      - name: Install pinned isolated public-index SDK
        run: python -m poc.cloud_report_beta03 install-dependency
      - name: Fresh tests and real network diagnostics
        if: ${{ always() }}
        run: python -m poc.cloud_report_beta03 run
      - name: Finalize acceptance evidence even on failure
        if: ${{ always() }}
        run: |
          python -m poc.cloud_report_beta03 finalize
      - name: Save sanitized diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beta03-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            beta03-artifacts/acceptance.json
            beta03-artifacts/acceptance.md
            beta03-artifacts/original-tests.json
            beta03-artifacts/backup-tests.json
            beta03-artifacts/cloud_contracts-tests.json
            beta03-artifacts/decoder_beta02-tests.json
            beta03-artifacts/index_beta03-tests.json
            beta03-artifacts/sha256.json
          if-no-files-found: error
          retention-days: 3
